# Reverse proxy used during the phased FastAPI cutover.
#
# By default everything goes to the legacy backend (port 3001). As each
# phase ports a subsystem, add a `location` block above the default to
# route those paths to the FastAPI app on port 8000.
#
# Phase 0 forwards only /_py/* (health, OpenAPI in dev).

worker_processes  1;
daemon off;
pid tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    include    /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    client_max_body_size 80m;

    upstream legacy  { server 127.0.0.1:3001; }
    upstream python  { server 127.0.0.1:8000; }
    upstream stream  { server 127.0.0.1:4000; }

    server {
        listen 3000 default_server;
        server_name localhost mastodon.local;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming server (WebSocket / SSE)
        location /api/v1/streaming {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
            proxy_pass http://stream;
        }

        # ---- Phase 0: Python health endpoint and dev OpenAPI ----
        location /_py/ { proxy_pass http://python; }

        # ---- Phase 1 (in progress): token validity + partial issuance ----
        # /oauth/authorize (consent UI) and /auth/* sign-in stay on legacy.
        location = /api/v1/apps/verify_credentials { proxy_pass http://python; }
        location = /api/v1/apps                    { proxy_pass http://python; }  # POST only
        location = /oauth/token                    { proxy_pass http://python; }
        location = /oauth/revoke                   { proxy_pass http://python; }

        # ---- Phase 2 (in progress): read API ----
        # Profile reads + public timeline only. Write/relationship/follow
        # endpoints under /api/v1/accounts/ continue to legacy.
        location = /api/v1/accounts/verify_credentials { proxy_pass http://python; }
        location = /api/v1/accounts/update_credentials { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+$        { proxy_pass http://python; }
        # Status read + delete + edit + source + history.
        location ~ ^/api/v1/statuses/[0-9]+$         { proxy_pass http://python; }
        location ~ ^/api/v1/statuses/[0-9]+/source$  { proxy_pass http://python; }
        location ~ ^/api/v1/statuses/[0-9]+/history$ { proxy_pass http://python; }
        location ~ ^/api/v1/statuses/[0-9]+/context$ { proxy_pass http://python; }

        location = /api/v1/timelines/public         { proxy_pass http://python; }

        # ---- Phase 3 (in progress): interactions + follow + post + profile + pin + instance ----
        # Media, polls, status edit metadata still go to legacy.
        location ~ ^/api/v1/statuses/[0-9]+/(un)?favourite$ { proxy_pass http://python; }
        location ~ ^/api/v1/statuses/[0-9]+/(un)?bookmark$  { proxy_pass http://python; }
        location ~ ^/api/v1/statuses/[0-9]+/(un)?reblog$    { proxy_pass http://python; }
        location ~ ^/api/v1/statuses/[0-9]+/(un)?pin$       { proxy_pass http://python; }
        location = /api/v1/instance                         { proxy_pass http://python; }
        location = /api/v2/instance                         { proxy_pass http://python; }
        location = /api/v1/statuses                         { proxy_pass http://python; }  # POST only on this route
        location = /api/v1/accounts/relationships           { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/(un)?follow$    { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/(un)?block$     { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/(un)?mute$      { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/(un)?pin$       { proxy_pass http://python; }
        location = /api/v1/endorsements                     { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/statuses$       { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/followers$      { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/following$      { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/note$           { proxy_pass http://python; }
        location = /api/v1/accounts/familiar_followers      { proxy_pass http://python; }
        location = /api/v1/timelines/home                   { proxy_pass http://python; }
        location ~ ^/api/v1/timelines/list/[0-9]+$          { proxy_pass http://python; }
        location ~ ^/api/v1/notifications(/|$)              { proxy_pass http://python; }
        location ~ ^/api/v1/lists(/|$)                      { proxy_pass http://python; }
        location = /api/v1/favourites                       { proxy_pass http://python; }
        location = /api/v1/bookmarks                        { proxy_pass http://python; }
        location = /api/v1/blocks                           { proxy_pass http://python; }
        location = /api/v1/mutes                            { proxy_pass http://python; }
        location ~ ^/api/v1/follow_requests(/|$)            { proxy_pass http://python; }
        location = /api/v1/custom_emojis                    { proxy_pass http://python; }
        location = /api/v1/markers                          { proxy_pass http://python; }
        location = /api/v1/preferences                      { proxy_pass http://python; }
        location ~ ^/api/v1/tags/[^/]+$                     { proxy_pass http://python; }
        location ~ ^/api/v1/tags/[^/]+/(un)?follow$         { proxy_pass http://python; }
        location ~ ^/api/v1/timelines/tag/[^/]+$            { proxy_pass http://python; }
        location ~ ^/api/v2/filters(/|$)                    { proxy_pass http://python; }
        location ~ ^/api/v1/announcements(/|$)              { proxy_pass http://python; }
        location ~ ^/api/v1/featured_tags(/|$)              { proxy_pass http://python; }
        location ~ ^/api/v1/accounts/[0-9]+/featured_tags$  { proxy_pass http://python; }
        location = /api/v1/reports                          { proxy_pass http://python; }
        location = /api/v1/domain_blocks                    { proxy_pass http://python; }
        location = /api/v1/suggestions                      { proxy_pass http://python; }
        location = /api/v2/suggestions                      { proxy_pass http://python; }
        location ~ ^/api/v1/conversations(/|$)              { proxy_pass http://python; }
        location = /api/v1/timelines/direct                 { proxy_pass http://python; }
        location = /api/v1/accounts/search                  { proxy_pass http://python; }
        location = /api/v1/accounts/lookup                  { proxy_pass http://python; }
        location = /api/v1/instance/peers                   { proxy_pass http://python; }
        location = /api/v1/instance/rules                   { proxy_pass http://python; }
        location ~ ^/api/v1/trends(/|$)                     { proxy_pass http://python; }
        location ~ ^/api/v1/media(/|$)                      { proxy_pass http://python; }
        location ~ ^/api/v2/media(/|$)                      { proxy_pass http://python; }
        location = /api/v2/search                           { proxy_pass http://python; }
        location ~ ^/api/v1/polls/[0-9]+(/votes)?$          { proxy_pass http://python; }

        # ---- Phase 6: federation (ActivityPub + WebFinger) ----
        # Local actors are served from Python; remote peers discover
        # and federate with us through these endpoints.
        location = /.well-known/webfinger                   { proxy_pass http://python; }
        location = /inbox                                   { proxy_pass http://python; }
        location ~ ^/users/[^/]+$                           { proxy_pass http://python; }
        location ~ ^/users/[^/]+/inbox$                     { proxy_pass http://python; }
        location ~ ^/users/[^/]+/outbox$                    { proxy_pass http://python; }
        location ~ ^/users/[^/]+/followers$                 { proxy_pass http://python; }
        location ~ ^/users/[^/]+/following$                 { proxy_pass http://python; }

        # ---- Promote paths below as each phase ships ----
        # Phase 1: location /oauth/ { proxy_pass http://python; }
        # Phase 1: location /auth/  { proxy_pass http://python; }
        # Phase 2: location /api/v1/timelines/home { ... }
        # Phase 2: location /api/v1/timelines/tag/  { ... }
        # Phase 3: /api/v1/statuses/{id}/{pin,unpin,mute,unmute,reactions/...}
        # ...

        # Default: legacy backend handles everything not promoted above.
        location / {
            proxy_pass http://legacy;
        }
    }
}
