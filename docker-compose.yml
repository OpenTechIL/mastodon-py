services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: mastodon_development
      POSTGRES_USER: mastodon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'mastodon']
    networks:
      - internal

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    networks:
      - internal

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: uv run uvicorn app.python.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MASTODON_ENV: development
      DB_HOST: db
      DB_USER: mastodon
      DB_NAME: mastodon_development
      REDIS_HOST: redis
    volumes:
      - .:/app
      - python_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  arq:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: uv run arq app.python.workers.arq_settings.WorkerSettings
    environment:
      MASTODON_ENV: development
      DB_HOST: db
      DB_USER: mastodon
      DB_NAME: mastodon_development
      REDIS_HOST: redis
    volumes:
      - .:/app
      - python_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  stream:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_NAME: mastodon_development
      DB_USER: mastodon
      REDIS_URL: redis://redis:6379
      PORT: '4000'
      BIND: '0.0.0.0'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  vite:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm i -g corepack && corepack enable && yarn dev"
    volumes:
      - .:/app
      - vite_modules:/app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn
    ports:
      - '127.0.0.1:3036:3036'
    networks:
      - internal

  proxy:
    image: nginx:alpine
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./config/nginx/docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - python
      - stream
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  python_venv:
  vite_modules:
  yarn_cache:

networks:
  internal:
