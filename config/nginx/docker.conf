worker_processes  1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    include    /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    client_max_body_size 80m;

    # Conditionally set Connection header: "upgrade" for WebSocket, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's internal resolver — re-resolve upstream IPs every 30s.
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream python  { server python:8000; }
    upstream stream  { server stream:4000; }
    upstream vite    { server vite:3036; }

    server {
        listen 3000 default_server;
        server_name localhost mastodon.local;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite dev server — JS/CSS hot-reload assets and HMR WebSocket
        location /packs-dev/ {
            proxy_set_header Host vite:3036;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://vite;
        }

        # Streaming server (WebSocket / SSE)
        location /api/v1/streaming {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
            proxy_pass http://stream;
        }

        # Everything else goes to FastAPI
        location / {
            proxy_pass http://python;
        }
    }
}
