[project]
name = "mastodon-python"
version = "0.0.0"
description = "Mastodon backend on FastAPI with async I/O."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "arq>=0.26",
  "redis[hiredis]>=5.2",
  "httpx>=0.28",
  "authlib>=1.4",
  "pyotp>=2.9",
  "cryptography>=44.0",
  "pyld>=2.0",
  "orjson>=3.10",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  "bleach>=6.2",
  "lxml>=5.3",
  "blurhash-python>=1.2",
  "pyvips>=2.2",
  "aiobotocore>=2.15",
  "aiosmtplib>=3.0",
  "premailer>=3.10",
  "jinja2>=3.1",
  "elasticsearch[async]>=8.16",
  "babel>=2.16",
  "bcrypt>=4.2",
  "piexif>=1.1.3",
  "itsdangerous>=2.2.0",
  "markdown>=3.10.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-postgresql>=6.1",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-bleach",
  "respx>=0.21",
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "honcho>=2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/python"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  "alembic/versions",
  "app/javascript",
  "vendor",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app/python"
namespace_packages = true
explicit_package_bases = true
exclude = ["alembic/versions/", "app/javascript/", "vendor/", "node_modules/"]

[[tool.mypy.overrides]]
module = ["pyld.*", "pyvips.*", "blurhash.*", "premailer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
