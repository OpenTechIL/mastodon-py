[project]
name = "mastodon-python"
version = "0.0.0"
description = "Mastodon backend on FastAPI with async I/O."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "arq>=0.26",
  "redis[hiredis]>=5.2",
  "httpx>=0.28",
  "authlib>=1.4",
  "pyotp>=2.9",
  "cryptography>=44.0",
  "pyld>=2.0",
  "orjson>=3.10",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  "bleach>=6.2",
  "lxml>=5.3",
  "blurhash-python>=1.2",
  "pyvips>=2.2",
  "aiobotocore>=2.15",
  "aiosmtplib>=3.0",
  "premailer>=3.10",
  "jinja2>=3.1",
  "elasticsearch[async]>=8.16",
  "babel>=2.16",
  "bcrypt>=4.2",
  "piexif>=1.1.3",
  "itsdangerous>=2.2.0",
  "markdown>=3.10.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-postgresql>=6.1",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-bleach",
  "respx>=0.21",
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "honcho>=2.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
exclude = ["/app/javascript"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  "alembic/versions",
  "app/javascript",
  "vendor",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PL"]
ignore = [
  "PLR0913", # too-many-arguments
  "S101", # assert-used (tests)
  "B008", # function-call-in-default-argument (FastAPI Depends())
  "PLC0415", # import-outside-top-level (lazy imports in routers)
  "PLW0603", # global-statement
  "PLW1510", # subprocess-run-without-check
  "PLW2901", # redefined-loop-name
  "S607", # start-process-with-partial-path
  "S603", # subprocess-without-shell-equals-true
  "S105", # hardcoded-password-string (false positives on token_scopes)
  "S106", # hardcoded-password-func-arg (false positives on token_type)
  "S110", # try-except-pass (intentional in registration/optional flows)
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR2004", # magic-value-comparison (HTTP status codes are self-documenting)
  "E402", # module-import-not-at-top-of-file
  "E501", # line-too-long (120 limit enforced by formatter)
  "F811", # redefined-while-unused (intentional re-exports)
  "F841", # unused-variable (some async results intentionally discarded)
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "ASYNC221", # run-process-in-async-function (FFmpeg/media processing)
  "ASYNC240", # blocking-path-method-in-async-function (local storage)
  "SIM102", # collapsible-if (readability preference)
  "SIM103", # needless-bool
  "SIM108", # if-else-block-instead-of-if-exp (readability preference)
  "PLC0206", # dict-index-missing-items
  "RUF012", # mutable-class-default
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.12"
# Core correctness checks
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# Relaxed for migration — add type annotations incrementally
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
exclude = ["alembic/versions/", "app/javascript/", "vendor/", "node_modules/"]

[[tool.mypy.overrides]]
module = [
  "pyld.*",
  "pyvips.*",
  "blurhash.*",
  "premailer.*",
  "aiobotocore.*",
  "botocore.*",
  "markdown.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
