name: Lint Python

on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check app/python/

      - name: Check formatting with ruff
        run: uv run ruff format --check app/python/

      - name: Type check with mypy
        run: uv run mypy app/python/
